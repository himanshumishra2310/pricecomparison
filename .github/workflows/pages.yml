name: Publish dashboard

# Copies docs/ to the gh-pages branch, which GitHub serves at
# https://himanshumishra2310.github.io/pricecomparison/
# Runs every time a crawl pushes new results.
on:
  push:
    branches: ['main', 'claude/saltstayz-price-comparator-9afgpo']
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ to gh-pages
        run: |
          set -e
          git config user.name "rate-parity-bot"
          git config user.email "rate-parity-bot@users.noreply.github.com"
          SRC="$(git rev-parse --short HEAD)"
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add /tmp/site origin/gh-pages
          else
            git worktree add --detach /tmp/site
            (cd /tmp/site && git checkout --orphan gh-pages && git rm -rfq . || true)
          fi
          rsync -a --delete --exclude .git docs/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then echo "Dashboard unchanged."; exit 0; fi
          git commit -q -m "Publish dashboard from $SRC"
          git push origin HEAD:gh-pages
          echo "Published https://himanshumishra2310.github.io/pricecomparison/"
