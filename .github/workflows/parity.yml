name: Rate parity check

on:
  schedule:
    # Every 2 hours (UTC). In IST that is 01:30, 03:30, 05:30 ... 23:30.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Data source: browser, serpapi or fixture'
        default: ''
        required: false

concurrency:
  group: rate-parity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PROVIDER: ${{ github.event.inputs.provider || vars.PROVIDER || 'serpapi' }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      FAIL_ON_ERRORS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium (browser provider only)
        if: env.PROVIDER == 'browser'
        run: npx playwright install --with-deps chromium

      - name: Crawl, compare and notify
        run: npm run run
        env:
          SCHEDULER: GitHub Actions

      - name: Save debug screenshots (browser provider only)
        if: always() && env.PROVIDER == 'browser'
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore

      - name: Commit results and dashboard
        if: always()
        run: |
          git config user.name "rate-parity-bot"
          git config user.email "rate-parity-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rate parity run $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi
