name: Rate parity check

# Runs every 2 hours on GitHub's servers (Google Hotels loads fine from there), commits the
# results to this branch and publishes the dashboard to the gh-pages branch, which GitHub Pages
# serves at https://himanshumishra2310.github.io/pricecomparison/
# Can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours UTC = 01:30, 03:30 ... 23:30 IST
  workflow_dispatch:
    inputs:
      provider:
        description: 'Data source: browser, serpapi or fixture'
        default: 'browser'
        required: true

concurrency:
  group: rate-parity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROVIDER: ${{ github.event.inputs.provider || vars.PROVIDER || 'browser' }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      FAIL_ON_ERRORS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium (browser provider only)
        if: env.PROVIDER == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Crawl, compare and notify
        run: npm run run
        env:
          SCHEDULER: GitHub Actions
      - name: Commit results
        run: |
          git config user.name "rate-parity-bot"
          git config user.email "rate-parity-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Nothing changed."; else
            git commit -m "Rate parity run $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi
      - name: Publish dashboard to gh-pages
        run: |
          set -e
          SRC="$(git rev-parse --short HEAD)"
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add /tmp/site origin/gh-pages
          else
            git worktree add --detach /tmp/site
            (cd /tmp/site && git checkout --orphan gh-pages && git rm -rfq . || true)
          fi
          rsync -a --delete --exclude .git docs/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then echo "Dashboard unchanged."; exit 0; fi
          git commit -q -m "Publish dashboard from $SRC"
          git push origin HEAD:gh-pages
          echo "Published https://himanshumishra2310.github.io/pricecomparison/"
