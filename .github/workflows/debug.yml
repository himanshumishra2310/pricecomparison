name: Debug one property

# Crawls a single property in Chromium and prints what Google's page looks like,
# so crawler problems can be diagnosed from the job log. Screenshots are saved as an artifact.
on:
  workflow_dispatch:
    inputs:
      property:
        description: 'Part of the property name, e.g. "Cyber Hub"'
        default: 'Cyber Hub'
        required: true
      window:
        description: 'D0, D1 or D2'
        default: 'D0'
        required: true
      query:
        description: 'Optional: a different Google search wording to try'
        default: ''
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Crawl with diagnostics
        run: DEBUG_DIR=debug DEBUG_PRINT=1 DEBUG_QUERY="${{ github.event.inputs.query }}" node src/debug-crawl.js "${{ github.event.inputs.property }}" "${{ github.event.inputs.window }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
